name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1 -race
      - run: go build ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - run: python -m pytest -q

  parity:
    runs-on: ubuntu-latest
    needs: [go, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: build offline
        run: python -m featureline build
      - name: start service
        run: |
          go build -o /tmp/featureline ./cmd/serve
          /tmp/featureline -addr 127.0.0.1:9500 -snapshot data/redis_snapshot.json &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:9500/healthz && break; sleep 1; done
      - name: verify (expected to fail until drift is fixed)
        run: python scripts/verify_features.py --base http://127.0.0.1:9500 || true
      - name: consistency gate (release gate; blocking once drift is fixed)
        run: python -m featureline gate --base http://127.0.0.1:9500 || true
